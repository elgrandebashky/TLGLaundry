{% extends "base.html" %}
{% block title %}Book a slot — Thomas Laubs Gade 25 - 29{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="page-heading">
                <div class="eyebrow">Plan ahead</div>
                <h1>Book your laundry slot</h1>
                <p class="lead">Choose a day and a time that fits your routine.</p>
            </div>
            <div class="panel">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="date">Date</label>
                            <input class="form-control" id="date" type="date" name="date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="time_slot">Starting time</label>
                            <select class="form-select" id="time_slot" name="time_slot" required>
                                <option value="" selected disabled>Select a time</option>
                                {% for time_slot in time_slots %}
                                    <option value="{{ time_slot }}">{{ time_slot }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Your booking will automatically reserve the next 3 consecutive hours.</div>
                        </div>
                    </div>
                    <button class="btn btn-brand w-100 mt-4" type="submit">Confirm booking <span aria-hidden="true">→</span></button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
